name: External link check

# Monthly check of every external URL in the content, README and docs.
# Opens (or updates) an issue when links break; does not block deploys.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress --format markdown --output ./lychee-report.md "src/content/**/*.md" "README.md" "CONTRIBUTING.md" "docs/**/*.md"
          fail: false

      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken external links found
          content-filepath: ./lychee-report.md
          labels: links
