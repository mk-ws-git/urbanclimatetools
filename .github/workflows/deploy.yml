name: Deploy to Cloudflare Pages

# Deploys main to the existing Pages project on every push.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
# Without them the job exits quietly, so it is safe to leave in place.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.gate.outputs.ready == 'true'
        run: npm ci

      # Uses the share images committed in public/og (generated locally with `npm run og`).
      - if: steps.gate.outputs.ready == 'true'
        run: npm run build

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=urbanclimatetools --branch=main
