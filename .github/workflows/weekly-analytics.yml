name: Weekly analytics

# Mondays: pull last week's traffic from Cloudflare Web Analytics and open an
# issue with the report. GitHub emails you the new issue; older reports are closed.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build the report
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/weekly-analytics.mjs

      - name: Open the report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create analytics --color 0e8a16 --description "Weekly traffic report" 2>/dev/null || true
          # Close earlier reports so only the newest stays open.
          for n in $(gh issue list --label analytics --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Superseded by this week's report."
          done
          gh issue create --title "$(cat analytics-title.txt)" --label analytics --body-file analytics-report.md
